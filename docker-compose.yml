# Docker Compose configuration for ASI-Chain Indexer

services:
  postgres:
    image: postgres:18.6-alpine
    container_name: asi-indexer-db
    environment:
      POSTGRES_DB: asichain
      POSTGRES_USER: indexer
      POSTGRES_PASSWORD: indexer_pass
    volumes:
      # PostgreSQL 18 uses PGDATA=/var/lib/postgresql/18/docker.
      # Existing installations must restore into this new volume; see POSTGRES_UPGRADE.md.
      - postgres18_data:/var/lib/postgresql
      - ./migrations/000_comprehensive_initial_schema.sql:/docker-entrypoint-initdb.d/000_comprehensive_initial_schema.sql
      - ./migrations/001_bigint_amounts.sql:/docker-entrypoint-initdb.d/001_bigint_amounts.sql
      - ./migrations/002_executed_transfers.sql:/docker-entrypoint-initdb.d/002_executed_transfers.sql
      - ./migrations/003_native_transfer_calls.sql:/docker-entrypoint-initdb.d/003_native_transfer_calls.sql
      - ./migrations/004_uint256_phlo_prices.sql:/docker-entrypoint-initdb.d/004_uint256_phlo_prices.sql
      - ./migrations/005_network_metrics_empty_range.sql:/docker-entrypoint-initdb.d/005_network_metrics_empty_range.sql
      - ./migrations/006_native_transfer_lifecycle_plans.sql:/docker-entrypoint-initdb.d/006_native_transfer_lifecycle_plans.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U indexer -d asichain" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - indexer-network

  indexer:
    build:
      context: .
      args:
        NODE_PROTOCOL_PROFILE: ${NODE_PROTOCOL_PROFILE:-classic}
    container_name: asi-indexer
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Node connectivity (gRPC + HTTP)
      NODE_HOST: ${NODE_HOST}
      GRPC_PORT: ${GRPC_PORT}
      HTTP_PORT: ${HTTP_PORT}
      NODE_PROTOCOL_PROFILE: ${NODE_PROTOCOL_PROFILE:-classic}
      NODE_TIMEOUT: ${NODE_TIMEOUT:-30}
      GRPC_MAX_RECEIVE_MESSAGE_BYTES: ${GRPC_MAX_RECEIVE_MESSAGE_BYTES:-67108864}
      NATIVE_TOKEN_DECIMALS: ${NATIVE_TOKEN_DECIMALS:-8}

      # Database
      DATABASE_URL: ${DATABASE_URL}
      DATABASE_POOL_SIZE: ${DATABASE_POOL_SIZE:-20}
      
      # Sync settings
      SYNC_INTERVAL: ${SYNC_INTERVAL:-5}
      BATCH_SIZE: ${BATCH_SIZE:-50}
      START_FROM_BLOCK: ${START_FROM_BLOCK:-0}
      
      # Monitoring
      MONITORING_PORT: 9090
      
      # Logging
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      LOG_FORMAT: ${LOG_FORMAT:-json}
      
      # Features
      ENABLE_ASI_TRANSFER_EXTRACTION: ${ENABLE_ASI_TRANSFER_EXTRACTION:-true}
      ENABLE_PENDING_DEPLOYS_SYNC: ${ENABLE_PENDING_DEPLOYS_SYNC:-true}
      ENABLE_METRICS: ${ENABLE_METRICS:-true}
      ENABLE_HEALTH_CHECK: ${ENABLE_HEALTH_CHECK:-true}
      READ_CACHE_ENABLED: ${READ_CACHE_ENABLED:-true}
      READ_CACHE_MAX_ENTRIES: ${READ_CACHE_MAX_ENTRIES:-256}

      # Alerts (Mattermost incoming webhook)
      ALERTS_ENABLED: ${ALERTS_ENABLED:-false}
      MATTERMOST_WEBHOOK_URL: ${MATTERMOST_WEBHOOK_URL:-}
      MATTERMOST_CHANNEL: ${MATTERMOST_CHANNEL:-}
      MATTERMOST_USERNAME: ${MATTERMOST_USERNAME:-asi-indexer}
      ALERT_THROTTLE_SEC: ${ALERT_THROTTLE_SEC:-3600}
      ALERT_TIMEOUT_SEC: ${ALERT_TIMEOUT_SEC:-5}
      ALERT_MAX_TEXT_LEN: ${ALERT_MAX_TEXT_LEN:-300}
      ALERT_STORE_TIMEOUT_SEC: ${ALERT_STORE_TIMEOUT_SEC:-1.0}
      ALERT_ENVIRONMENT: ${ALERT_ENVIRONMENT:-unknown}
      SYNC_STALL_THRESHOLD: ${SYNC_STALL_THRESHOLD:-3}
      NODE_UNREACHABLE_CYCLES: ${NODE_UNREACHABLE_CYCLES:-3}
      LAG_ALERT_BLOCKS: ${LAG_ALERT_BLOCKS:-500}
      LAG_ALERT_CYCLES: ${LAG_ALERT_CYCLES:-60}
      LAG_RECOVERY_RATIO: ${LAG_RECOVERY_RATIO:-0.9}
      CURSOR_STUCK_CYCLES: ${CURSOR_STUCK_CYCLES:-3}
    ports:
      - "9090:9090"  # Monitoring endpoints
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    networks:
      - indexer-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  metrics-cron:
    image: alpine:3.24
    container_name: asi-metrics-cron
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL}
      LOOKBACK_HOURS: 168
      BUCKET_SECONDS: 300
    volumes:
      - ./scripts:/scripts:ro
    networks:
      - indexer-network
    restart: unless-stopped
    entrypoint: >
      sh -c '
        set -e
        echo "[metrics-cron] Container starting..."
        apk update >/dev/null 2>&1
        apk add --no-cache postgresql18-client dcron >/dev/null 2>&1
        echo "[metrics-cron] Installed psql & dcron."
        echo "*/3 * * * * /scripts/refresh-network-metrics-once.sh >> /proc/1/fd/1 2>&1" | crontab -
        echo "[metrics-cron] Current crontab:"
        crontab -l
        echo "[metrics-cron] Starting crond -f..."
        crond -f -l 2
      '


  hasura:
    image: hasura/graphql-engine:v2.51.4
    container_name: asi-hasura
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Database connection
      HASURA_GRAPHQL_DATABASE_URL: postgresql://indexer:indexer_pass@postgres:5432/asichain
      
      # Console and admin
      HASURA_GRAPHQL_ENABLE_CONSOLE: "true"
      HASURA_GRAPHQL_ADMIN_SECRET: ${HASURA_ADMIN_SECRET:-todo}
      HASURA_GRAPHQL_UNAUTHORIZED_ROLE: "public"
      
      # GHC runtime: at most 8 capabilities, never more than the CPUs. The image
      # default (-N) starts one per host CPU and exhausts the 1024 open-file limit
      # on hosts with hundreds of CPUs. See DEPLOYMENT.md.
      GHCRTS: ${HASURA_GHCRTS:--maxN8}

      # Performance and real-time optimization
      HASURA_GRAPHQL_LIVE_QUERIES_MULTIPLEXED_REFETCH_INTERVAL: "500"
      HASURA_GRAPHQL_LIVE_QUERIES_MULTIPLEXED_BATCH_SIZE: "100"
      HASURA_GRAPHQL_STREAMING_QUERIES_MULTIPLEXED_REFETCH_INTERVAL: "500"
      HASURA_GRAPHQL_STREAMING_QUERIES_MULTIPLEXED_BATCH_SIZE: "100"
      
      # Security and features
      HASURA_GRAPHQL_ENABLE_TELEMETRY: "false"
      HASURA_GRAPHQL_CORS_DOMAIN: "*"
      HASURA_GRAPHQL_WS_READ_COOKIE: "false"
      HASURA_GRAPHQL_STRINGIFY_NUMERIC_TYPES: "true"
    restart: unless-stopped
    networks:
      - indexer-network
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://localhost:8080/healthz || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 5
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

networks:
  indexer-network:
    driver: bridge

volumes:
  postgres18_data:
