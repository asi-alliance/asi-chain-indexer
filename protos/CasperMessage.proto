/**
 * The main API is `DeployService`.
 */
syntax = "proto3";

package casper;

// If you are building for other languages "scalapb.proto"
// can be manually obtained here:
// https://raw.githubusercontent.com/scalapb/ScalaPB/master/protobuf/scalapb/scalapb.proto
// make a scalapb directory in this file's location and place it inside

import "scalapb/scalapb.proto";
import "RhoTypes.proto";

option (scalapb.options) = {
  package_name: "coop.rchain.casper.protocol"
  flat_package: true
  single_file: true
  preamble: "sealed trait CasperMessageProto"
  preserve_unknown_fields: false
};

message HasBlockRequestProto {
  option (scalapb.message).extends = "CasperMessageProto";
  bytes  hash = 1;
}

message HasBlockProto {
  option (scalapb.message).extends = "CasperMessageProto";
  bytes  hash = 1;
}

message BlockRequestProto {
  option (scalapb.message).extends = "CasperMessageProto";
  bytes  hash = 1;
}

// -------- Phase 7b-1 snapshot chunk-fetch --------
// Joiners request individual 4 MiB chunks of a finalized snapshot
// by (block_hash, chunk_index).  block_hash keys into the
// serving validator's `snapshot_merkle_roots` cache to locate the
// on-disk snapshot; chunk_index selects the 4 MiB slice.  The
// response carries the raw bytes plus the chunk's precomputed
// Blake2b256 hash so the requester can verify against a
// concurrently-fetched inclusion proof against the anchored root.
//
// Server-provided hash fields (chunk_hash, merkle_root) are
// ADVISORY — the receiver MUST re-derive from the raw bytes and
// its locally-anchored root respectively.  See each field's
// comment for the authoritative-vs-advisory contract.
//
// Merkle-tree shape: the chunk-hash tree is a plain bottom-up
// binary Merkle tree with LAST-LEAF DUPLICATION on odd-count
// levels (standard practice).  A receiver verifying an
// inclusion proof MUST apply the identical duplication rule
// when reconstructing the parent chain, or the recomputed root
// will diverge from `merkle_root` even for well-formed
// snapshots.  Pinned here against drift between the Wave 3.5
// server slice and the Wave 3.6 client slice.

message GetSnapshotChunkRequestProto {
  option (scalapb.message).extends = "CasperMessageProto";
  bytes  block_hash    = 1;   // finalized block hash whose snapshot to fetch
  uint32 chunk_index   = 2;   // which 4 MiB piece
}

message SnapshotChunkResponseProto {
  option (scalapb.message).extends = "CasperMessageProto";
  bytes  block_hash    = 1;   // echo of the request's block_hash
  uint32 chunk_index   = 2;   // echo of the request's chunk_index
  bytes  chunk_bytes   = 3;   // raw chunk payload (may be < 4 MiB for tail)
  // Blake2b256(chunk_bytes) — 32 bytes.
  //
  // ADVISORY.  The receiver MUST recompute `Blake2b256(chunk_bytes)`
  // locally and compare — a malicious server could stuff a hash
  // that walks the Merkle proof without matching the actual
  // bytes, so trusting this field as authoritative would skip
  // the real check.  Kept in the wire for a fast pre-verify
  // short-circuit when the bytes are large.
  bytes  chunk_hash    = 4;
  // Merkle root anchor over all chunk hashes — 32 bytes.
  //
  // ADVISORY.  The receiver MUST compare against the root it
  // locally anchored via block finalization (NOT trust the
  // response's claim).  A matching value is a necessary
  // sanity check; it is NOT the authority.
  bytes  merkle_root   = 5;
  uint32 chunk_count   = 6;   // total number of chunks in this snapshot
  repeated MerkleProofStepProto merkle_proof = 7; // inclusion proof for chunk_index
}

// One step of a bottom-up Merkle inclusion proof.  sibling_hash
// is the co-child at this level; is_sibling_right = true means
// the sibling is the right child (concat = current || sibling);
// false means left (concat = sibling || current).
message MerkleProofStepProto {
  bytes sibling_hash        = 1;
  bool  is_sibling_right    = 2;
}

// Sent by a joiner asking "do you have a serveable snapshot for
// this block?"  Broadcast + point-to-point; serving nodes reply
// with HasSnapshotProto when they can serve it.  Mirrors the
// HasBlockRequestProto / HasBlockProto pattern.
message HasSnapshotRequestProto {
  option (scalapb.message).extends = "CasperMessageProto";
  bytes block_hash = 1;
}

// Response to HasSnapshotRequestProto.  Carries `merkle_root`
// so the joiner can pin an anchor BEFORE issuing per-chunk
// requests.  Both merkle_root and chunk_count here are
// ADVISORY — the joiner MUST re-verify merkle_root against
// its locally-anchored root (from block finalization) and
// expect chunk_count to match the actual chunks it later
// receives via GetSnapshotChunkRequest.  A server
// reporting an inflated chunk_count would be caught by the
// per-chunk inclusion-proof check during fetch.
message HasSnapshotProto {
  option (scalapb.message).extends = "CasperMessageProto";
  bytes  block_hash  = 1;
  bytes  merkle_root = 2;   // ADVISORY anchor the joiner can pin
  uint32 chunk_count = 3;   // ADVISORY count the joiner can budget
}

// -------- Phase 7b-2 between-snapshot WAL payload fetch --------
// After a joiner has assembled the latest snapshot, the WAL
// between that snapshot and the head block still references
// payload bytes by Blake2b256 hash.  For each hash that the
// joiner can't reproduce locally (deterministic-Rholang /
// deploy-data reducer misses), it asks peers for the bytes by
// hash.  The response echoes the hash + the raw bytes; the
// joiner rehashes the bytes to verify against the requested
// hash before applying.
//
// `payload_hash` in BOTH request and response is the content-
// address.  The echoed hash in the response is ADVISORY — the
// joiner MUST recompute `Blake2b256(payload_bytes)` and compare
// against the ORIGINAL request's hash.  A server returning
// mismatched bytes with a correct-looking echoed hash would
// otherwise skip the real content-integrity check.
//
// Payload sizes are bounded by write-op semantics: single
// fs_write / fs_read replies map to one hash.  Cap enforced
// at MAX_PAYLOAD_BYTES = 4 MiB (same as snapshot CHUNK_SIZE —
// a natural upper bound; anything larger would already be
// chunked by Phase 7b-1 during snapshot).

message GetWalPayloadRequestProto {
  option (scalapb.message).extends = "CasperMessageProto";
  bytes payload_hash = 1;   // Blake2b256(payload bytes) — 32 bytes
}

message WalPayloadResponseProto {
  option (scalapb.message).extends = "CasperMessageProto";
  // ADVISORY echo of the request's payload_hash.  Receiver
  // MUST recompute `Blake2b256(payload_bytes)` and compare
  // against the ORIGINAL request's hash (NOT this echo).
  bytes payload_hash  = 1;
  bytes payload_bytes = 2;  // raw payload bytes; joiner rehashes to verify
}

// Sent by a joiner asking "do you have bytes for this payload
// hash?"  Broadcast + point-to-point; serving nodes reply with
// HasWalPayloadProto when they can serve it.  Mirrors the
// HasSnapshotRequestProto / HasSnapshotProto pattern.
message HasWalPayloadRequestProto {
  option (scalapb.message).extends = "CasperMessageProto";
  bytes payload_hash = 1;
}

// Response to HasWalPayloadRequestProto.  Carries `payload_size`
// so the joiner can budget before issuing the full fetch via
// GetWalPayloadRequest.  Size is ADVISORY — the receiver MUST
// cap at MAX_PAYLOAD_BYTES (4 MiB) regardless of what the
// server claims here, and the actual response's byte count is
// the authoritative truth.  A server over-reporting here would
// get caught by the comm-layer message-size limit before memory
// pressure.
message HasWalPayloadProto {
  option (scalapb.message).extends = "CasperMessageProto";
  bytes  payload_hash = 1;
  uint32 payload_size = 2;   // ADVISORY count the joiner can budget
}

message ForkChoiceTipRequestProto {
  option (scalapb.message).extends = "CasperMessageProto";
}

// ---------- Signing Protocol ---------
message ApprovedBlockCandidateProto {
  option (scalapb.message).extends = "CasperMessageProto";
  BlockMessageProto block  = 1 [(scalapb.field).no_box = true];
  int32 requiredSigs       = 2;
}

message UnapprovedBlockProto {
  option (scalapb.message).extends = "CasperMessageProto";
  ApprovedBlockCandidateProto candidate = 1 [(scalapb.field).no_box = true];
  int64                       timestamp = 2;
  int64                       duration  = 3;
}

message Signature {
  bytes  publicKey = 1;
  string algorithm = 2;
  bytes  sig       = 3;
}

message BlockApprovalProto {
  option (scalapb.message).extends = "CasperMessageProto";
  ApprovedBlockCandidateProto candidate = 1 [(scalapb.field).no_box = true];
  Signature sig                         = 2 [(scalapb.field).no_box = true];
}

// The anchor's finalized floor and frontier as the responder derived them,
// so a node restored from that anchor can start deriving forward instead of
// re-deriving finality from history it will never hold.
//
// Both blocks are named by hash AND number because the receiver needs the
// numbers before it holds the blocks: they size the download window, and the
// hashes are useless until the blocks they name are on disk.
message FinalizedFloorSeedProto {
  bytes floorHash       = 1;
  int64 floorNumber     = 2;
  bytes frontierHash    = 3;
  int64 frontierNumber  = 4;
}

message ApprovedBlockProto  {
  option (scalapb.message).extends = "CasperMessageProto";
  ApprovedBlockCandidateProto candidate = 1 [(scalapb.field).no_box = true];
  repeated Signature sigs               = 2;
  // Deliberately here and not on the candidate: the candidate's serialized
  // bytes are the payload the genesis ceremony signs and `Validate::approved_block`
  // re-derives, so a field there would put unsigned peer-supplied data inside
  // the signed envelope. Absent from peers that predate it, which the receiver
  // handles by deferring rather than by assuming a floor.
  FinalizedFloorSeedProto floorSeed     = 3;
}

// The finalized-floor cache for a set of blocks, shipped so a restored node
// receives finality for its window instead of re-deriving it from history it
// does not keep. Values are pure functions of the named blocks, computed by
// the responder when it validated them; trust is the same class as the
// approved block itself — the peer that chose your anchor.
message FloorCacheRequestProto {
  repeated bytes hashes = 1;
}

message FloorCacheEntryProto {
  bytes blockHash    = 1;
  bytes floorHash    = 2;
  bytes frontierHash = 3;
}

message FloorCacheResponseProto {
  repeated FloorCacheEntryProto entries = 1;
  // The shard's genesis block hash (empty when the responder does not hold
  // it). A truncated requester holds no height-0 block but must seed
  // newly-bonded latest-message slots with the same network-uniform genesis
  // sentinel every ceremony node derives locally. Same trust class as the
  // entries: the peer that chose the anchor.
  bytes genesisHash = 2;
  // The genesis block itself (absent when the responder does not hold it).
  // Hash-addressed: the receiver verifies it against genesisHash before
  // storing, so the field carries no trust of its own. Holding genesis makes
  // a truncated node's latest-message structures identical to a ceremony
  // node's — the newly-bonded sentinel points at it and the propose snapshot
  // dereferences every slot.
  BlockMessageProto genesisBlock = 3;
}

message ApprovedBlockRequestProto {
  option (scalapb.message).extends = "CasperMessageProto";
  string identifier = 1;
  bool trimState    = 2;
}

message NoApprovedBlockAvailableProto {
  option (scalapb.message).extends = "CasperMessageProto";
  string identifier    = 1;
  string nodeIdentifier = 2;
}

// ------- End Signing Protocol --------

// --------- Core Protocol  --------
message BlockMessageProto {
  option (scalapb.message).extends = "CasperMessageProto";
  bytes                       blockHash      = 1; // obtained by hashing the information in the header
  HeaderProto                 header         = 2 [(scalapb.field).no_box = true];
  BodyProto                   body           = 3 [(scalapb.field).no_box = true];
  repeated JustificationProto justifications = 4; // map of all validators to latest blocks based on current view
  bytes                       sender         = 5; // public key of the validator that created the block
  int32                       seqNum         = 6; // number of blocks created by the validator
  bytes                       sig            = 7; // signature generated by signing `hash(hash(justification) concat blockHash)`.
  string                      sigAlgorithm   = 8; // name of the algorithm used to sign
  string                      shardId        = 9; // identifier of the shard where the block was created
  bytes                       extraBytes     = 10;
}

message BlockHashMessageProto {
  option (scalapb.message).extends = "CasperMessageProto";
  bytes  hash         = 1;
  bytes  blockCreator = 2;
}

message BlockMetadataInternal {
  // This message in mapped to a different Scala class because of protobuf's inability to create map<bytes, int64> for
  // bonds.
  option (scalapb.message).type = "coop.rchain.models.BlockMetadata";

  bytes blockHash                            = 1;
  repeated bytes parents                     = 2 [(scalapb.field).collection_type="collection.immutable.List"];
  bytes sender                               = 3;
  repeated JustificationProto justifications = 4 [(scalapb.field).collection_type="collection.immutable.List"];
  repeated BondProto bonds                   = 5 [(scalapb.field).collection_type="collection.immutable.List"];
  int64 blockNum                             = 6;
  int32 seqNum                               = 7;
  bool invalid                               = 8; // whether the block was marked as invalid
  bool directlyFinalized                     = 9; // whether the block has been last finalized block (LFB)
  bool finalized                             = 10;// whether the block is finalized
  float faultToleranceValue                  = 11;// cached normalized FT at finalization time
  bytes mergeBase                            = 12;// recorded state parent (BlockProto body mergeBase); empty = header-derivable
}

message HeaderProto {
  repeated bytes parentsHashList = 1; //list of parent block hashes
  int64 timestamp  = 5;
  int64 version    = 6;
  bytes extraBytes = 7;
}

/**
 * Note: deploys are uniquely keyed by `user`, `timestamp`.
 *
 * **TODO**: details of signatures and payment. See RHOL-781
 */
message DeployDataProto {
  bytes  deployer             = 1; //public key
  string term                 = 2; //rholang source code to deploy (will be parsed into `Par`)
  int64  timestamp            = 3; //millisecond timestamp
  bytes  sig                  = 4; //signature of (hash(term) + timestamp) using private key
  string sigAlgorithm         = 5; //name of the algorithm used to sign
  int64 phloPrice             = 7; //phlo price
  int64 phloLimit             = 8; //phlo limit for the deployment
  int64 validAfterBlockNumber = 10;
  string shardId              = 11;//shard ID to prevent replay of deploys between shards
  string language             = 12;//language (rholang or metta) of the source code
  int64 expirationTimestamp   = 13;//optional millisecond timestamp after which deploy is invalid (0 = no expiration)
  repeated DeployParameter parameters = 14;
}

message DeployParameter {
  string name = 1;
  RholangValue value = 2;
}

message RholangValue {
  oneof value {
    bool bool_value = 1;
    sint64 int_value = 2;
    string string_value = 3;
    bytes bytes_value = 4;
    RholangSequence tuple_value = 5;
    RholangSequence list_value = 6;
    RholangSequence set_value = 7;
    RholangMap map_value = 8;
    RholangNil nil_value = 9;
    string uri_value = 10;
  }
}

message RholangSequence {
  repeated RholangValue values = 1;
}

message RholangMap {
  repeated RholangMapEntry entries = 1;
}

message RholangMapEntry {
  RholangValue key = 1;
  RholangValue value = 2;
}

message RholangNil {}

message ProcessedDeployProto {
    DeployDataProto deploy        = 1 [(scalapb.field).no_box = true];
    rhoapi.PCost cost             = 2 [(scalapb.field).no_box = true];
    repeated EventProto deployLog = 3; //the new terms and comm. rule reductions from this deploy
    bool errored                  = 5; //true if deploy encountered a user error
    string systemDeployError      = 6;
}

message SlashSystemDeployDataProto {
  bytes invalidBlockHash = 1;
  bytes issuerPublicKey = 2;
  int64 targetActivationEpoch = 3;
}

message CloseBlockSystemDeployDataProto{
}

message SystemDeployDataProto{
  oneof systemDeploy{
    SlashSystemDeployDataProto slashSystemDeploy = 1;
    CloseBlockSystemDeployDataProto closeBlockSystemDeploy = 2;
  }
}

message ProcessedSystemDeployProto {
    SystemDeployDataProto systemDeploy = 1 [(scalapb.field).no_box = true];
    repeated EventProto deployLog      = 2;
    string errorMsg                    = 3;
}

message BodyProto {
  RChainStateProto state                            = 1 [(scalapb.field).no_box = true];
  repeated ProcessedDeployProto deploys             = 2;
  repeated ProcessedSystemDeployProto systemDeploys = 3;
  bytes extraBytes                                  = 4;
  repeated RejectedDeployProto rejectedDeploys      = 5;
  // User-deploy sigs whose chains this block's merge APPLIED from scope
  // into its pre-state. The state plane's positive fact: a deploy's
  // effect enters a state either by fresh execution (a `deploys` entry)
  // or by a merge re-applying its chain — which, without this field, no
  // block data records. Empty for non-merged blocks. Validator-recomputed
  // and consensus-checked alongside rejectedDeploys.
  repeated bytes appliedFromScope                   = 6;
  // The block whose committed state this block's pre-state derives from:
  // for a merged block its main parent, or the floor block when that
  // parent's state does not hold the floor's settled content; the covering
  // parent for the fast path; empty where the header derives it
  // (single-parent and genesis). Recording it makes state-membership a walk over recorded
  // pointers instead of a per-block re-derivation:
  // state(B) = state(mergeBase) + appliedFromScope + deploys.
  bytes mergeBase                                   = 7;
}

message RejectedDeployProto{
  bytes sig       = 1;
  // Set by the merge that formed this record when the sig's effect is
  // present in that merge's own post-state (a kept copy in the same merge,
  // or already settled in its base): the record discarded a redundant copy
  // and does not dispute the sig's standing win. Validators recompute the
  // flag during checkpoint validation; a mismatch invalidates the block.
  bool duplicate  = 2;
  // The block that held the copy this record adjudicated. The merge knows
  // it exactly (the rejected chain's source block); recording it makes
  // coverage an equality instead of an inference. Validators recompute the
  // carrier during checkpoint validation; a mismatch invalidates the block.
  bytes carrier   = 3;
}

message JustificationProto {
  bytes validator       = 1;
  bytes latestBlockHash = 2;
}

message RChainStateProto {
  bytes preStateHash  = 1; //hash of the tuplespace contents before new deploys
  bytes postStateHash = 2; //hash of the tuplespace contents after new deploys

  //Internals of what will be the "blessed" PoS contract
  //(which will be part of the tuplespace in the real implementation).
  repeated BondProto bonds = 3;
  int64 blockNumber        = 4;
}

message EventProto {
  oneof event_instance {
    ProduceEventProto produce = 1;
    ConsumeEventProto consume = 2;
    CommEventProto comm       = 3;
  }
}

message ProduceEventProto {
  bytes channelsHash         = 1;
  bytes hash                 = 2;
  bool persistent            = 3;
  int32 timesRepeated        = 4;
	bool isDeterministic       = 5;
  repeated bytes outputValue = 6;
  bool failed                = 7;
}

message ConsumeEventProto {
  repeated bytes channelsHashes = 1;
  bytes hash                    = 2;
  bool persistent               = 3;
}

message CommEventProto {
  ConsumeEventProto consume           = 1 [(scalapb.field).no_box = true];
  repeated ProduceEventProto produces = 2;
  repeated PeekProto peeks            = 3;
}

message PeekProto {
  int32 channelIndex = 1;
}

message BondProto {
  bytes validator = 1;
  int64 stake     = 2;
}
// --------- End Core Protocol  --------

// --------- Last finalized state  --------

message StoreNodeKeyProto {
  bytes hash  = 1;
  int32 index = 2;
}

message StoreItemsMessageRequestProto {
  option (scalapb.message).extends = "CasperMessageProto";
  repeated StoreNodeKeyProto startPath = 1 [(scalapb.field).collection_type="collection.immutable.List"];
  int32 skip                           = 2;
  int32 take                           = 3;
}

message StoreItemProto {
  bytes key   = 1;
  bytes value = 2;
}

message StoreItemsMessageProto {
  option (scalapb.message).extends = "CasperMessageProto";
  repeated StoreNodeKeyProto startPath = 1 [(scalapb.field).collection_type="collection.immutable.List"];
  repeated StoreNodeKeyProto lastPath  = 2 [(scalapb.field).collection_type="collection.immutable.List"];
  repeated StoreItemProto historyItems = 3 [(scalapb.field).collection_type="collection.immutable.List"];
  repeated StoreItemProto dataItems    = 4 [(scalapb.field).collection_type="collection.immutable.List"];
}

// --------- End Last finalized state  --------

// --------- Mergeable channels store sync --------

message MergeableEntryRequestProto {
  option (scalapb.message).extends = "CasperMessageProto";
  bytes block_hash = 1;
}

message MergeableEntryResponseProto {
  option (scalapb.message).extends = "CasperMessageProto";
  bytes block_hash       = 1;
  // bincode of Vec<DeployMergeableData>. Empty bytes = peer has the block but
  // no entry for it.
  bytes serialized_entry = 2;
}
