name: Python tests

on:
  pull_request:
    branches: [dev, main, "chore/deps-*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit tests (Python 3.15, ${{ matrix.profile }})
    runs-on: ubuntu-latest
    container: python:3.15.2-slim-bookworm
    timeout-minutes: 10
    strategy:
      matrix:
        profile: [classic, uint256]
    env:
      NODE_PROTOCOL_PROFILE: ${{ matrix.profile }}
    steps:
      - name: Install checkout and build tools
        run: apt-get update && apt-get install -y --no-install-recommends git make
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check interpreter version references
        run: |
          version="$(python -c 'import platform; print(platform.python_version())')"
          echo "CI interpreter: ${version}"
          for file in Dockerfile DEPENDENCIES.md README.md; do
            if ! grep -qF "${version}" "$file"; then
              echo "::error file=${file}::does not reference Python ${version}"
              exit 1
            fi
          done
      - name: Check native decimal support
        run: python -c 'import _decimal, decimal; assert decimal.Decimal is _decimal.Decimal'
      - name: Install test dependencies
        run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Generate gRPC stubs
        run: make protos PYTHON=python
      - name: Run unit tests with coverage
        run: >-
          python -W error::DeprecationWarning -m pytest tests/ -m "not integration" -v
          --strict-markers
          --cov=src --cov-report=term-missing --cov-report=xml
          --junitxml=test-results.xml
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-test-reports-3.15-${{ matrix.profile }}
          path: |
            coverage.xml
            test-results.xml
          if-no-files-found: ignore
          retention-days: 7

  # Temporary dual-version validation: run the uint256 profile on the previous
  # interpreter as well, so the 3.15.2 upgrade is proven against a 3.14 baseline.
  # Remove this job once the upgrade has been accepted.
  unit-tests-python-314:
    name: Unit tests (Python 3.14, uint256)
    runs-on: ubuntu-latest
    container: python:3.14.10-slim-bookworm
    timeout-minutes: 10
    env:
      NODE_PROTOCOL_PROFILE: uint256
    steps:
      - name: Install checkout and build tools
        run: apt-get update && apt-get install -y --no-install-recommends git make
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check native decimal support
        run: python -c 'import _decimal, decimal; assert decimal.Decimal is _decimal.Decimal'
      - name: Install test dependencies
        run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Generate gRPC stubs
        run: make protos PYTHON=python
      - name: Run unit tests with coverage
        run: >-
          python -W error::DeprecationWarning -m pytest tests/ -m "not integration" -v
          --strict-markers
          --cov=src --cov-report=term-missing --cov-report=xml
          --junitxml=test-results.xml
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-test-reports-3.14-uint256
          path: |
            coverage.xml
            test-results.xml
          if-no-files-found: ignore
          retention-days: 7
