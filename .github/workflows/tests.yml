name: Python tests

on:
  pull_request:
    branches: [dev, main, "chore/deps-*"]
  push:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Unit tests (Python 3.14)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.14.10'
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-dev.lock
      - name: Install test dependencies
        run: python -m pip install --require-hashes -r requirements-dev.lock
      - name: Generate gRPC stubs
        run: make protos PYTHON=python
      - name: Run unit tests with coverage
        run: >-
          python -W error::DeprecationWarning -m pytest tests/ -m "not integration" -v
          --strict-markers
          --cov=src --cov-report=term-missing --cov-report=xml
          --junitxml=test-results.xml
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: unit-test-reports
          path: |
            coverage.xml
            test-results.xml
          if-no-files-found: ignore
          retention-days: 7
