name: Deploy Clean Indexer DevNet AlexNet

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout
        uses: actions/checkout@v3
      
      - name: Configure SSH 
        run: |
          mkdir -p ~/.ssh/
          
          echo "${{ secrets.DC_DEV_KRONE_TARGET_PRIVATE_KEY }}" > ~/.ssh/target_key
          chmod 600 ~/.ssh/target_key
          
          cat << 'EOF' > ~/.ssh/config
          Host alexnet-server
            HostName ${{ secrets.DC_DEV_KRONE_TARGET_HOST }}
            User ${{ secrets.DC_DEV_KRONE_TARGET_USER }}
            Port ${{ secrets.DC_DEV_KRONE_TARGET_PORT }}
            IdentityFile ~/.ssh/target_key 
            StrictHostKeyChecking no
          EOF
          
          chmod 600 ~/.ssh/config
      
      - name: Run install script
        run: |
          cd ~/indexer
          ssh alexnet-server "bash deploy.sh --clean"
